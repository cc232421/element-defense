<!DOCTYPE html>
<html>
<head><title>Element Defense — Live Diagnostics</title>
<style>
body{background:#0D1B2A;color:#e0e0e0;font-family:monospace;font-size:13px;padding:10px}
#log{height:90vh;overflow-y:scroll;white-space:pre}
.fatal{color:#e74c3c;font-weight:bold}
.ok{color:#2ecc71}
.warn{color:#f39c12}
.info{color:#3498db}
</style>
</head>
<body><div id="log"></div>
<script src="index.html"></script>
<script>
// Hijack the diagnostic — monkey-patch key functions
const DIAG = {
  attack_mod: null,
  dmg_calc: [],
  collision_tested: 0,
  collision_hit: 0,
  zombies_killed: 0,
  game_started: false
};

const log = document.getElementById('log');
function D(msg, cls='info'){ log.textContent += `\n[${new Date().toISOString().substr(11,8)}] ${msg}`; log.scrollTop=log.scrollHeight; }

// Patch gameLoop to inject diagnostics
const _origGameLoop = window.gameLoop;
window.gameLoop = function(ts) {
  if(GS.phase !== 'playing' && !DIAG.game_started) {
    log.innerHTML += '\n⏳ Waiting for game to start (select world + play)...';
  }
  if(GS.phase === 'playing' && !DIAG.game_started) {
    DIAG.game_started = true;
    D('🎮 GAME STARTED', 'fatal');
    D(`canvas: ${canvas.width}x${canvas.height}`, 'info');
    D(`LANES=${GS.LANES} COLS=${GS.COLS} cellSize=${GS.cellSize} LANE_H=${GS.LANE_H}`, 'info');
    D(`FIELD_X=${GS.FIELD_X}  field.length=${GS.field.length}`, 'info');
  }
  return _origGameLoop.apply(this, arguments);
};

// Patch update to track env
const _origUpdate = window.update;
window.update = function(dt, ts) {
  if(GS.phase === 'playing') {
    // Log env on first frame
    if(!DIAG.attack_mod) {
      DIAG.attack_mod = GS.env.element_attack_mod;
      D(`GS.env.element_attack_mod = ${DIAG.attack_mod}`, DIAG.attack_mod === undefined ? 'fatal' : 'ok');
      D(`GS.env.element_global_hp_mod = ${GS.env.element_global_hp_mod}`, GS.env.element_global_hp_mod === undefined ? 'fatal' : 'ok');
    }
    // Track zombies
    if(GS.zombies.length > 0 && !this._loggedZombies) {
      this._loggedZombies = true;
      const z = GS.zombies[0];
      D(`First zombie: x=${Math.round(z.x)} hp=${z.hp} maxHp=${z.maxHp} speed=${z.speed}`, 'warn');
    }
  }
  return _origUpdate.apply(this, arguments);
};

// Patch spawnProjectile to track damage
const _origSpawn = window.spawnProjectile;
window.spawnProjectile = function(x, y, dmg, elem, lane) {
  D(`  FIRE [${elem.symbol}]: dmg=${dmg?.toFixed(1)} x=${Math.round(x)} lane=${lane}`, 'info');
  return _origSpawn.apply(this, arguments);
};

// Intercept damage application — can't easily patch z.hp -= so watch GS.zombies
const _origRender = window.render;
window.render = function() {
  if(GS.phase === 'playing' && GS.zombies.length > 0) {
    const z = GS.zombies[0];
    if(this._lastZHp !== undefined && this._lastZHp !== z.hp) {
      D(`💥 ZOMBIE HIT: hp ${this._lastZHp.toFixed(1)} → ${z.hp.toFixed(1)}  (diff=${(this._lastZHp - z.hp).toFixed(1)})`, 'warn');
      if(z.hp <= 0) D(`💀 ZOMBIE DEAD at x=${Math.round(z.x)}`, 'fatal');
    }
    this._lastZHp = z.hp;
  }
  return _origRender.apply(this, arguments);
};

D('Diagnostic loaded — start game to see live data', 'info');
</script></body>
</html>
